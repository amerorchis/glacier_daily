name: Tests

on:
  pull_request:
    branches: [ main ]

# Empty values so modules exercise their graceful-degradation paths in CI.
env:
  NPS: ""
  DRIP_TOKEN: ""
  DRIP_ACCOUNT: ""
  FTP_PASSWORD: ""
  FTP_USERNAME: ""
  FTP_SERVER: ""
  ALERTS_PWD: ""
  BC_TOKEN: ""
  BC_STORE_HASH: ""
  FLICKR_KEY: ""
  FLICKR_SECRET: ""
  GLACIERNPS_UID: ""
  webcam_ftp_user: ""
  webcam_ftp_pword: ""
  timelapse_server: ""
  MAPBOX_TOKEN: ""
  MAPBOX_ACCOUNT: ""
  MAPBOX_STYLE: ""
  SUNSETHUE_KEY: ""
  GOOGLE_APPLICATION_CREDENTIALS: ""
  NOTICES_SPREADSHEET_ID: ""
  ENVIRONMENT: "development"

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.10"

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run pre-commit hooks
        run: |
          uv run pre-commit run --all-files --show-diff-on-failure --verbose

  unit-and-integration-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.10"

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Create directory (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p email_images/today/

      - name: Create directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path email_images/today/

      - name: Run tests
        run: |
          echo "Running test suite with coverage on ${{ matrix.os }}..."
          uv run pytest test/ --cov=. --cov-report xml --tb=short

      - name: Upload results to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: amerorchis/glacier_daily

  # Runs on the production Raspberry Pi, which holds decrypted secrets and sits
  # on the tailnet. `uv sync` and pytest both execute code from the PR head, so
  # this job must never run for a pull request opened from a fork.
  arm-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gnpic]
    timeout-minutes: 10
    env:
      # python-build-standalone's armv7 3.11 segfaults on this Pi, so uv must
      # never fetch one. The interpreter to use instead comes from UV_PYTHON in
      # the runner's own .env on the box.
      UV_PYTHON_DOWNLOADS: "never"
    steps:
      # actions/checkout is a Node action, and since the Node 20 removal
      # (2026-09-23) the runner refuses Node actions on 32-bit ARM ("Linux ARM32
      # runners are no longer supported"): Node 24 has no ARM32 build. Shell
      # steps still run, so check out with git. Keep this job free of
      # `uses:` steps.
      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git fetch -q --depth 1 --no-tags "https://github.com/${{ github.repository }}" "${{ github.sha }}"
          git checkout -q --force FETCH_HEAD
          # Like actions/checkout's clean, but keep .venv so uv sync stays fast.
          git clean -ffdxq -e .venv

      # uv and Python 3.11 are preinstalled on the Pi.
      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Create directory
        run: |
          mkdir -p email_images/today/

      - name: Run tests
        run: |
          echo "Running test suite with coverage on self-hosted ARM..."
          uv run pytest test/ --cov=. --cov-report xml --tb=short

      - name: Remove checkout credentials
        if: always()
        shell: bash
        run: git config --local --unset-all http.https://github.com/.extraheader || true
